[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-audit"
version = "2.1.0"
description = "DevSecOps Vulnerability Audit & Compliance Assessment Suite"
readme = "README.md"
authors = [
    { name = "Security Research & DevSecOps Team", email = "rayzanzavio@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["security", "scanner", "vulnerability", "audit", "owasp", "devsecops", "nuclei", "burpsuite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "rich>=13.7.0",
    "colorama>=0.4.6",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "tabulate>=0.9.0",
]

[project.scripts]
cyber-audit = "cyber_audit:main"

[project.urls]
Homepage = "https://github.com/rayzanzavio/cybersecurity-vulnerability-audit-scanner"
Repository = "https://github.com/rayzanzavio/cybersecurity-vulnerability-audit-scanner.git"
Issues = "https://github.com/rayzanzavio/cybersecurity-vulnerability-audit-scanner/issues"
